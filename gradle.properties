# 防止 OOM
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.vfs.watch=false
# 注：暂不启用 org.gradle.configuration-cache——存储配置缓存会强制解析 :test 的
#     运行时类路径，离线构建时会因缺少 natives 下载而失败

# Fabric Properties
# https://fabricmc.net/develop
minecraft_version=26.3
loader_version=0.19.5
loom_version=1.18.2

# 第三方库
pinyin4j_version=2.5.1

# Mod Properties
mod_version=0.2.0-beta
maven_group=bundlestash
