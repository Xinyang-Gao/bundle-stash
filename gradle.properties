# 防止 OOM（6 个 loom 节点配置较吃内存）
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.vfs.watch=false
# 本仓库使用 Groovy DSL，关闭 Stonecutter 的 Groovy 提醒
dev.kikugie.stonecutter.hard_mode=true
# 注：暂不启用 org.gradle.configuration-cache——存储配置缓存会强制解析 :test 的
#     运行时类路径，离线构建时会因缺少 natives 下载而失败

# 第三方库
pinyin4j_version=2.5.1

# Mod Properties
mod_version=1.0.1
maven_group=bundlestash

# 各节点的 Minecraft / 加载器版本见 versions/<版本>-<加载器>/gradle.properties
